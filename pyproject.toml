[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crossbank-fl"
version = "0.1.0"
description = "Cross-bank federated fraud detection"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flwr[simulation]>=1.28,<2",
    "torch",
    "numpy",
    "pandas",
    "scikit-learn",
]

[tool.hatch.build.targets.wheel]
packages = ["src/crossbank"]

[tool.flwr.app]
publisher = "cloud-team-18"

[tool.flwr.app.components]
serverapp = "crossbank.fl.server_app:app"
clientapp = "crossbank.fl.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 2
local-epochs = 1
batch-size = 1024
learning-rate = 0.001
max-samples = 100000